<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ступени — Тренажёр слуха</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <a class="brand" href="index.html">Тренажёр слуха</a>
    <nav class="nav"><a href="degrees.html" class="current">Ступени</a><a href="progressions.html">Прогрессии</a><a href="songs.html">Аккорды песен</a><a href="melodies.html">Мелодии песен</a></nav>
  </header>
  <script src="header.js"></script>

  <section class="session">
    <div class="session-steps" id="sessionSteps"></div>
    <div class="session-text" id="sessionText"></div>
    <div class="session-settings">
      
      <button class="gear" id="btnSettings" aria-label="Настройки" data-tip="Настройки"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <div class="popover" id="settingsPop" hidden>
        <div class="pop-row"><span class="pop-label">Уровень</span><div class="levels-list" id="levelsList"></div></div>
        <div class="pop-row"><span class="pop-label">Тембр</span><select id="timbre"><option value="auto">по уровню</option></select></div>
        <div class="pop-row"><label class="check"><input type="checkbox" id="autoNext"> Переходить дальше автоматически</label></div>
        <div class="levels" id="levels" hidden></div>
      </div>
    </div>
  </section>

  <section class="stage-mid">
    <div class="actions">
      <button class="btn primary" id="btnPlay">Слушать</button>
      <button class="link" id="btnNoteOnly" hidden>только нота</button>
    </div>
    <div class="part-line">Какая ступень звучит после каденции?</div>
    <div class="keys" id="keys"></div>
    <div class="actions" id="nextActions" hidden><button class="btn primary" id="btnNext">Дальше</button></div>
    <div class="feedback" id="feedback"></div>
  </section>
  <div id="levelNote" hidden></div><div id="progressText" hidden></div><div id="weak" hidden></div><div class="history" id="history" hidden></div><button id="btnReset" hidden></button>
</div>
<div id="toast"></div>
<script src="theory.js"></script>
<script src="progressions.js"></script>
<script src="synth.js"></script>
<script src="common.js"></script>
<script src="exercise-degrees.js"></script>
</body>
</html>
