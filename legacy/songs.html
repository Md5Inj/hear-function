<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аккорды песен — Тренажёр слуха</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body data-task="chords" class="dock">
<div class="wrap wide">
  <header class="top">
    <a class="brand" href="index.html">Тренажёр слуха</a>
    <nav class="nav"><a href="degrees.html">Ступени</a><a href="progressions.html">Прогрессии</a><a href="songs.html" class="current">Аккорды песен</a><a href="melodies.html">Мелодии песен</a></nav>
  </header>
  <script src="header.js"></script>

  <section class="session">
    <div class="session-steps" id="sessionSteps"></div>
    <div class="session-text" id="sessionText">Серия из 10</div>
    <div class="session-settings">
      
      <button class="gear" id="btnSettings" aria-label="Настройки" data-tip="Настройки"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <div class="popover" id="settingsPop" hidden>
        <div class="pop-row"><span class="pop-label">Уровень</span><div class="levels-list" id="levelsList"></div></div>
        <div class="levels" id="levels" hidden></div>
      </div>
    </div>
  </section>

  <section class="stage-mid">
    <div class="qinfo" id="qinfo"></div>
    <div class="skeleton" id="skeleton"><div class="sk-row"></div><div class="sk-chips"><i></i><i></i><i></i><i></i><i></i></div><div class="sk-btn"></div></div>
    <div id="chordsBlock" hidden>
      <div class="sheet-wrap" id="sheetWrap"><div class="sheet" id="sheet"></div></div>
      <div class="sel-pop" id="transport" hidden>
        <button class="btn quiet mini" id="btnPlaySel">▶ играть</button>
        <button class="btn quiet mini" id="btnLoop" data-tip="Зациклить (L)">⟲ цикл</button>
        <button class="btn quiet mini" data-rate="0.5" data-tip="Половинная скорость">0.5×</button>
        <button class="btn quiet mini" data-rate="1" hidden>1×</button>
        <button class="btn quiet mini" data-rate="0.75" hidden>0.75×</button>
      </div>
      <div class="vocab" id="vocab"></div>
    </div>
    <div id="melodyBlock" hidden>
      <div class="part-line"><span id="melodyLyric"></span> <button class="link" id="btnPhrase">слушать фразу</button></div>
      <div class="sheet-wrap"><div class="sheet notes" id="melSheet"></div></div>
      <div class="keys" id="melKeys"></div>
    </div>
    <div class="actions" id="answerActions">
      <button class="btn primary" id="btnCheck" disabled>Проверить</button>
      <button class="btn primary" id="btnNext" hidden>Дальше</button>
      <button class="btn" id="btnRetry" hidden>Исправить</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </section>

  <div id="levelNote" hidden></div><div id="progressText" hidden></div><div id="weak" hidden></div><div class="history" id="history" hidden></div>

<div class="dockbar">
  <div class="dock-inner">
    <div class="player dock-player"><div id="player"></div></div>
    <div class="dock-info">
      <div class="song-title"><span id="songTitle"></span> <span class="info up" tabindex="0">?<span class="tip" id="songRange"></span></span></div>
      <div class="song-meta" id="songMeta"></div>
    </div>
    <div class="dock-controls">
      <button class="btn primary" id="btnPlay">▶ Слушать</button>
      <button class="btn quiet" id="btnTonic" data-tip="Тонический аккорд (T)">Тоника</button>
      <button class="btn quiet" id="btnNoCadence" data-tip="Запись без каденции">Без каденции</button>
    </div>
  </div>
</div>
</div>
<div id="toast"></div>
<script src="theory.js"></script>
<script src="progressions.js"></script>
<script src="songs-db.js"></script>
<script src="synth.js"></script>
<script src="yt.js"></script>
<script src="common.js"></script>
<script src="exercise-songs.js"></script>
</body>
</html>
