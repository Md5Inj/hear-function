<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аккаунт — Тренажёр слуха</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap wide">
  <header class="top">
    <a class="brand" href="index.html">Тренажёр слуха</a>
    <nav class="nav"><a href="degrees.html">Ступени</a><a href="progressions.html">Прогрессии</a><a href="songs.html">Аккорды песен</a><a href="melodies.html">Мелодии песен</a></nav>
  </header>
  <script src="header.js"></script>

  <section class="account">
    <div class="hist-head"><h1>Аккаунт</h1></div>
    <form class="acc-row" id="emailForm">
      <div class="acc-info"><div class="acc-title">Почта</div><div class="acc-desc">Адрес для входа. Сейчас: <span id="accCurrent"></span></div></div>
      <div class="acc-fields">
        <label>Email<input type="email" id="accEmail" required autocomplete="email"></label>
        <label>Текущий пароль<input type="password" id="accEmailPass" required autocomplete="current-password"></label>
        <div class="acc-actions"><button class="btn primary" type="submit">Сменить почту</button><span class="auth-err" id="emailErr"></span><span class="auth-ok" id="emailOk"></span></div>
      </div>
    </form>
    <form class="acc-row" id="passForm">
      <div class="acc-info"><div class="acc-title">Пароль</div><div class="acc-desc">Не короче шести символов.</div></div>
      <div class="acc-fields">
        <label>Текущий пароль<input type="password" id="accOldPass" required autocomplete="current-password"></label>
        <div class="acc-two">
          <label>Новый пароль<input type="password" id="accNewPass" required minlength="6" autocomplete="new-password"></label>
          <label>Ещё раз<input type="password" id="accNewPass2" required minlength="6" autocomplete="new-password"></label>
        </div>
        <div class="acc-actions"><button class="btn primary" type="submit">Сменить пароль</button><span class="auth-err" id="passErr"></span><span class="auth-ok" id="passOk"></span></div>
      </div>
    </form>
  </section>
</div>
<div id="toast"></div>
<script src="theory.js"></script>
<script src="progressions.js"></script>
<script src="synth.js"></script>
<script src="common.js"></script>
<script src="account.js"></script>
</body>
</html>
